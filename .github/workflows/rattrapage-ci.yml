name: rattrapage-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rattrapage-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: var-www/maths.labomaths.tn/Interface_Maths_2025_2026

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install --only-shell chromium

      - name: Run rattrapage unit and e2e tests
        run: npm run test:rattrapage
