name: rattrapage-ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rattrapage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: var-www/maths.labomaths.tn/Interface_Maths_2025_2026

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check Chrome availability
        run: google-chrome --version

      - name: Run rattrapage unit and e2e tests
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
        run: npm run test:rattrapage
