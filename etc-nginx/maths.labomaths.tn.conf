server {
    listen 80;
    listen [::]:80;
    server_name maths.labomaths.tn;

    include /etc/nginx/snippets/letsencrypt_acme.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maths.labomaths.tn;

    include /etc/nginx/snippets/letsencrypt_acme.conf;
    ssl_certificate /etc/letsencrypt/live/maths.labomaths.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maths.labomaths.tn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Static site root
    root /var/www/maths;
    index index.html;

    # Favicon
    location = /favicon.ico { alias /var/www/maths/assets/img/icon.svg; }

    # Service worker - no cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Cache assets
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Content alias
    location /content/ {
        alias /var/www/maths/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # API reverse proxy to maths_portal backend (port 8002)
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Redirect sans slash vers avec slash
    location = /rappels_trigonometrie {
        return 301 /rappels_trigonometrie/;
    }
    # Static directory - bypass SPA
    location /rappels_trigonometrie/ {
        alias /var/www/maths/rappels_trigonometrie/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Expose premiers evaluation storage API
    location ^~ /expose_premiers/api/ {
        rewrite ^/expose_premiers/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8037;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # Fallback: serve /_next/ assets via frontend (stale cache safety net)
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Default
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Next.js assets - no auth required
    location ^~ /correction/_next/ {
        rewrite ^/correction(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
    }

    # correction workflow
    location /correction/api/health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /correction/api/ {
        auth_basic "Correction";
        auth_basic_user_file /etc/nginx/auth/correction.htpasswd;
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/correction_api_auth_header.conf;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }
    location /correction/ {
        auth_basic "Correction";
        auth_basic_user_file /etc/nginx/auth/correction.htpasswd;
        proxy_pass http://127.0.0.1:3011/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

}
